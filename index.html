<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>MyDigital RPH Auth Lab</title>

  <script
    src="https://accounts.google.com/gsi/client"
    async
    defer>
  </script>
</head>
<body>

  <h1>MyDigital RPH Auth Lab</h1>
  <p>Google Identity Services Test</p>

  <div
    id="g_id_onload"
    data-client_id="353334375851-vklgkc7oijffa22rhhsl3pu043gmnr9b.apps.googleusercontent.com"
    data-callback="handleCredentialResponse"
    data-auto_prompt="false">
  </div>

  <div
    class="g_id_signin"
    data-type="standard"
    data-size="large"
    data-theme="outline"
    data-text="signin_with"
    data-shape="rectangular">
  </div>

  <p id="status">Belum login.</p>

  <button onclick="debugSendToOpener()">
  TEST OPENER BRIDGE
</button>

 <script>

  function debugSendToOpener() {

    if (
      window.opener &&
      !window.opener.closed
    ) {

      window.opener.postMessage(
        {
          type: 'MYRPH_GOOGLE_ID_TOKEN',
          idToken: 'DEBUG_TOKEN'
        },
        '*'
      );

      document.getElementById('status').textContent =
        'DEBUG token dihantar ke opener.';

    } else {

      document.getElementById('status').textContent =
        'DEBUG gagal — opener tiada.';
    }
  }


  function handleCredentialResponse(response) {

    if (response && response.credential) {

      document.getElementById('status').textContent =
        'Google login berjaya. ID token diterima.';

      const message = {
        type: 'MYRPH_GOOGLE_ID_TOKEN',
        idToken: response.credential
      };

      if (
        window.opener &&
        !window.opener.closed
      ) {

        window.opener.postMessage(
          message,
          '*'
        );

        document.getElementById('status').textContent =
          'Token dihantar ke MyDigital RPH.';

        setTimeout(function() {
          window.close();
        }, 1000);

        return;
      }

      if (
        window.parent &&
        window.parent !== window
      ) {
        window.parent.postMessage(
          message,
          '*'
        );
      }

    } else {

      document.getElementById('status').textContent =
        'Google login gagal.';
    }
  }

</script>
